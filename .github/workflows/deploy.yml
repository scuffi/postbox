name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # First run on a fresh account creates the D1 database, R2 bucket and
      # queues; later runs find them and move on. Anything else fails loudly.
      - name: Provision Cloudflare resources
        run: |
          provision() {
            name="$1"; shift
            if out=$(npx wrangler "$@" 2>&1); then
              echo "Created $name."
            elif echo "$out" | grep -qiE "already (exists|registered|used)|code 1000[0-9]"; then
              echo "$name already exists — reusing."
            else
              echo "::error::Failed to provision $name"
              echo "$out"
              exit 1
            fi
          }
          provision "D1 database 'mailflare'" d1 create mailflare
          provision "R2 bucket 'mailflare-raw'" r2 bucket create mailflare-raw
          provision "queue 'mailflare-inbound'" queues create mailflare-inbound
          provision "queue 'mailflare-outbound'" queues create mailflare-outbound

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          OPEN_NEXT_DEPLOY: "true"
